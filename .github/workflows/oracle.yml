name: Clinical Oracle + Integrity Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q pytest flask vulture

      - name: Run clinical oracle (immutable correctness reference)
        run: python -m pytest test_oracle.py -v

      - name: Check locked files were not modified
        # Fail if any locked file was changed in this push.
        # On the very first commit (no parent) this step is skipped.
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            LOCKED="PURPOSE.md HYPOTHESES.md RULES.md test_oracle.py"
            for f in $LOCKED; do
              if git diff --name-only HEAD~1 HEAD | grep -qx "$f"; then
                echo "ERROR: locked file '$f' was modified — this is a protocol violation."
                exit 1
              fi
            done
            echo "All locked files unchanged."
          else
            echo "First commit — skipping locked-file check."
          fi

      - name: Check DISCLAIMER is present
        run: python -c "
from calculator import DISCLAIMER
assert 'NOT FOR CLINICAL USE' in DISCLAIMER, 'DISCLAIMER violation: NOT FOR CLINICAL USE missing'
print('DISCLAIMER OK:', DISCLAIMER)
"
