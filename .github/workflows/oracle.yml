name: Oracle tests (JS)

on: [push]

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run locked oracle
        run: npx jest test_oracle.test.js --no-coverage

      - name: Check locked files not modified
        run: |
          if git diff HEAD~1 HEAD -- PURPOSE.md HYPOTHESES.md RULES.md test_oracle.test.js 2>/dev/null | grep -q '^+'; then
            echo "ERROR: locked file was modified"
            exit 1
          fi

      - name: Check DISCLAIMER present
        run: node -e "const {DISCLAIMER}=require('./calculator'); if(!DISCLAIMER.includes('NOT FOR CLINICAL USE')){process.exit(1)}"
